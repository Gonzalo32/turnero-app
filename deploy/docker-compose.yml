# Producción: copiar este archivo, Caddyfile, el .env y keycloak/realm-senza.json a ~/turnero en el servidor.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - turnero
      - keycloak

  turnero:
    image: ghcr.io/gonzalo32/turnero-app:latest
    restart: unless-stopped
    env_file: .env
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ISSUER: https://auth.${DOMAIN}/realms/senza
      CORS_ORIGIN: https://${DOMAIN}
    depends_on:
      - mongo
      - keycloak

  # Sin "ports": MongoDB solo es accesible desde la red interna (AGENTS.md §54).
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  # Público solo vía Caddy en https://auth.${DOMAIN} (sin /admin ni realm master).
  # Consola de administración: ssh -L 8080:localhost:8080 <vps> → http://localhost:8080/admin/
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: start --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      KC_HOSTNAME: https://auth.${DOMAIN}
      KC_HOSTNAME_ADMIN: http://localhost:8080
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:?}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:?}
      # Placeholders de realm-senza.json (solo se usan en la primera importación)
      TURNERO_PUBLIC_URL: https://${DOMAIN}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?}
      KEYCLOAK_APP_ADMIN_PASSWORD: ${KEYCLOAK_APP_ADMIN_PASSWORD:?}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./realm-senza.json:/opt/keycloak/data/import/realm-senza.json:ro
    depends_on:
      - keycloak-db

  # Sin "ports": solo accesible por Keycloak en la red interna.
  keycloak-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data

volumes:
  caddy-data:
  mongo-data:
  keycloak-db-data:
