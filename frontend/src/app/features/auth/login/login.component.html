<div class="min-h-screen flex items-center justify-center p-6 bg-app-main relative overflow-hidden">

  <!-- Luces radiales de fondo decorativas -->
  <div class="absolute -top-32 -left-32 w-96 h-96 bg-brand-purple/10 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-brand-purple/10 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Tarjeta central de Login -->
  <div class="relative w-full max-w-md bg-white border border-brand-purple/15 rounded-3xl p-8 sm:p-10 shadow-2xl shadow-brand-purple/10 flex flex-col z-10 transition-all duration-300">

    <!-- Logo / ícono institucional -->
    <div class="self-center mb-4 text-center">
      <span class="font-brand text-6xl leading-none italic font-normal text-brand-purple pr-1 select-none drop-shadow-[0_8px_16px_rgba(134,99,133,0.25)]">S</span>
    </div>

    <h1 class="font-brand text-2xl sm:text-[1.7rem] font-bold text-center tracking-tight bg-gradient-to-r from-app-text to-brand-purple bg-clip-text text-transparent mb-1.5">
      Sistema Odontológico
    </h1>
    <p class="text-sm text-app-muted text-center font-normal mb-7 leading-relaxed">
      Ingresá tu correo, contraseña y consultorio para acceder
    </p>

    <!-- Error de autenticación o conexión -->
    <div
      *ngIf="errorMsg()"
      role="alert"
      class="flex items-center gap-2.5 bg-red-500/10 border border-red-500/20 text-red-600 px-4 py-3 rounded-xl text-xs sm:text-sm font-medium mb-6"
    >
      <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span>{{ errorMsg() }}</span>
    </div>

    <!-- Formulario -->
    <form class="flex flex-col gap-5" (submit)="$event.preventDefault(); login()" novalidate>

      <!-- Campo 1: Correo electrónico o Usuario -->
      <div class="flex flex-col gap-1.5">
        <label class="text-[0.75rem] font-bold text-brand-purple uppercase tracking-wider" for="input-email">
          Correo electrónico o Usuario
        </label>
        <div class="relative flex items-center">
          <input
            id="input-email"
            type="text"
            class="w-full bg-app-main border border-brand-purple/25 rounded-xl text-app-text font-medium text-sm sm:text-base py-3 pr-10 pl-4 outline-none transition-all duration-200 hover:bg-[#f0edf0] focus:border-brand-purple focus:ring-2 focus:ring-brand-purple/20 focus:bg-white disabled:opacity-50 disabled:cursor-not-allowed"
            [ngModel]="email()"
            (ngModelChange)="email.set($event)"
            name="email"
            required
            autocomplete="username"
            [disabled]="isSubmitting()"
          />
          <div class="absolute right-3.5 text-brand-purple pointer-events-none flex items-center justify-center">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
          </div>
        </div>
      </div>

      <!-- Campo 2: Contraseña -->
      <div class="flex flex-col gap-1.5">
        <label class="text-[0.75rem] font-bold text-brand-purple uppercase tracking-wider" for="input-password">
          Contraseña
        </label>
        <div class="relative flex items-center">
          <input
            id="input-password"
            [type]="showPassword() ? 'text' : 'password'"
            class="w-full bg-app-main border border-brand-purple/25 rounded-xl text-app-text font-medium text-sm sm:text-base py-3 pr-10 pl-4 outline-none transition-all duration-200 hover:bg-[#f0edf0] focus:border-brand-purple focus:ring-2 focus:ring-brand-purple/20 focus:bg-white disabled:opacity-50 disabled:cursor-not-allowed"
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
            name="password"
            required
            autocomplete="current-password"
            [disabled]="isSubmitting()"
          />
          <button
            type="button"
            class="absolute right-3 p-1 text-brand-purple/75 hover:text-brand-purple hover:bg-brand-purple/10 rounded-md transition-colors duration-150 flex items-center justify-center"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Ver contraseña'"
            title="Alternar visibilidad"
            tabindex="-1"
          >
            <svg *ngIf="!showPassword()" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg *ngIf="showPassword()" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Campo 3: Consultorio -->
      <div class="flex flex-col gap-1.5">
        <label class="text-[0.75rem] font-bold text-brand-purple uppercase tracking-wider" for="select-office">
          Consultorio
        </label>
        <div class="relative flex items-center">
          <select
            id="select-office"
            class="w-full appearance-none bg-app-main border border-brand-purple/25 rounded-xl text-app-text font-semibold text-sm sm:text-base py-3 pr-10 pl-4 outline-none cursor-pointer transition-all duration-200 hover:bg-[#f0edf0] focus:border-brand-purple focus:ring-2 focus:ring-brand-purple/20 focus:bg-white disabled:opacity-50 disabled:cursor-not-allowed"
            [ngModel]="selectedOffice()"
            (ngModelChange)="selectedOffice.set($event)"
            name="consultorio"
            required
            [disabled]="isSubmitting()"
          >
            <option value="" disabled class="bg-white text-app-text">— Seleccioná un consultorio —</option>
            <option *ngFor="let o of offices" [value]="o" class="bg-white text-app-text">{{ o }}</option>
          </select>
          <div class="absolute right-3.5 text-brand-purple pointer-events-none flex items-center justify-center">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </div>
        </div>
      </div>

      <!-- Botón de Ingreso (deshabilitado hasta que los 3 campos estén completos) -->
      <button
        type="submit"
        id="btn-login"
        class="w-full flex items-center justify-center gap-2 py-3.5 px-6 mt-2 rounded-xl text-white font-bold text-base bg-gradient-to-r from-brand-purple to-brand-purple-light shadow-md shadow-brand-purple/30 transition-all duration-200 hover:-translate-y-0.5 hover:shadow-lg hover:shadow-brand-purple/40 active:translate-y-0 disabled:opacity-40 disabled:cursor-not-allowed disabled:transform-none disabled:shadow-none"
        [disabled]="!canLogin()"
      >
        <span *ngIf="!isSubmitting()" class="inline-flex items-center gap-2">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
            <polyline points="10 17 15 12 10 7"/>
            <line x1="15" y1="12" x2="9" y2="12"/>
          </svg>
          Ingresar
        </span>
        <span *ngIf="isSubmitting()" class="inline-flex items-center gap-2">
          <svg class="w-4 h-4 animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
          </svg>
          Iniciando sesión...
        </span>
      </button>

    </form>

  </div>
</div>
