<!-- ══════════════════════════════════════════════════════════════════════════════
     HEADER DE LA SECCIÓN ODONTÓLOGOS
══════════════════════════════════════════════════════════════════════════════ -->
<div class="section-header">
  <div class="section-title-group">
    <h2 class="section-title">Odontólogos</h2>
    <p class="section-sub">Equipo profesional y cuerpo odontológico de Senza</p>
  </div>

  <div class="header-actions">
    <button
      class="btn-refresh"
      (click)="loadData()"
      [disabled]="loading()"
      title="Actualizar lista"
    >
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" [class.spinning]="loading()">
        <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
      </svg>
    </button>

    <button
      class="btn-primary-add"
      (click)="onCreateProfessional()"
      id="btn-create-professional"
    >
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <line x1="19" y1="8" x2="19" y2="14"/>
        <line x1="22" y1="11" x2="16" y2="11"/>
      </svg>
      <span>Nuevo Odontólogo</span>
    </button>
  </div>
</div>

<!-- MENSAJE DE ÉXITO -->
<div class="success-banner" *ngIf="successMessage()">
  <div class="success-icon">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <polyline points="20 6 9 17 4 12"></polyline>
    </svg>
  </div>
  <span class="success-text">{{ successMessage() }}</span>
  <button class="banner-close" (click)="successMessage.set(null)">×</button>
</div>

<!-- ERROR DE CARGA -->
<div class="error-banner" *ngIf="error()">
  <span>{{ error() }}</span>
  <button class="btn-retry" (click)="loadData()">Reintentar</button>
</div>

<!-- ══════════════════════════════════════════════════════════════════════════════
     TABLA REUTILIZABLE (DATA TABLE COMPONENT)
══════════════════════════════════════════════════════════════════════════════ -->
<app-data-table
  [columns]="columns"
  [data]="professionals()"
  [actions]="actions"
  [loading]="loading()"
  [searchable]="true"
  searchPlaceholder="Buscar por nombre, apellido, especialidad o matrícula..."
  countLabel="odontólogos"
  emptyMessage="No se encontraron odontólogos registrados"
  (actionClick)="onAction($event)"
  (rowClick)="onRowSelected($event)"
/>

<!-- ══════════════════════════════════════════════════════════════════════════════
     MODAL DE CREACIÓN / EDICIÓN DE ODONTÓLOGO
══════════════════════════════════════════════════════════════════════════════ -->
<app-professional-form-modal
  *ngIf="isModalOpen()"
  [professional]="editingProfessional()"
  (closed)="onModalClose()"
  (saved)="onProfessionalSaved($event)"
/>
