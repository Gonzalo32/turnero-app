<div class="section-header">
  <div class="section-title-group">
    <h2 class="section-title">Usuarios</h2>
    <p class="section-sub">Accesos al sistema: rol, sede y profesional vinculado</p>
  </div>

  <div class="header-actions">
    <select class="btn-refresh" style="width:auto;padding:0 .75rem" [value]="roleFilter()" (change)="roleFilter.set($any($event.target).value)" title="Filtrar por rol">
      <option value="">Todos los roles</option>
      <option *ngFor="let r of roles" [value]="r[0]">{{ r[1] }}</option>
    </select>

    <button class="btn-refresh" (click)="loadData()" [disabled]="loading()" title="Actualizar lista">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" [class.spinning]="loading()">
        <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
      </svg>
    </button>

    <button class="btn-primary-add" (click)="openModal(null)" id="btn-create-user">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <line x1="19" y1="8" x2="19" y2="14"/>
        <line x1="22" y1="11" x2="16" y2="11"/>
      </svg>
      <span>Nuevo usuario</span>
    </button>
  </div>
</div>

<div class="success-banner" *ngIf="successMessage()">
  <span class="success-text">{{ successMessage() }}</span>
  <button class="banner-close" (click)="successMessage.set(null)">×</button>
</div>

<div class="error-banner" *ngIf="error()">
  <span>{{ error() }}</span>
  <button class="btn-retry" (click)="error.set(null); loadData()">Reintentar</button>
</div>

<app-data-table
  [columns]="columns"
  [data]="filteredUsers()"
  [actions]="actions"
  [loading]="loading()"
  [searchable]="true"
  searchPlaceholder="Buscar por nombre, usuario o sede..."
  countLabel="usuarios"
  emptyMessage="No hay usuarios cargados"
  (actionClick)="onAction($event)"
  (rowClick)="openModal($event)"
/>

<app-user-form-modal
  *ngIf="isModalOpen()"
  [user]="editingUser()"
  [sedes]="sedes()"
  (closed)="isModalOpen.set(false)"
  (saved)="onSaved($event)"
/>
