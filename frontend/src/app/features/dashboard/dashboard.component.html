<div class="dashboard-shell">

  <!-- ══════════════════ ZONA DE BORDE Y BOTÓN DE RESTAURACIÓN ══════════════════ -->
  <!-- Detecta el cursor en el borde izquierdo cuando la barra lateral está oculta -->
  <div
    *ngIf="isSidebarHidden()"
    class="sidebar-edge-zone"
    (mouseenter)="onEdgeHover()"
    (mouseleave)="onEdgeLeave()"
    aria-hidden="true"
  ></div>

  <!-- Botón flotante temporal para volver a mostrar el menú lateral -->
  <button
    *ngIf="isSidebarHidden()"
    type="button"
    class="btn-restore-sidebar"
    [class.btn-restore-sidebar--visible]="showRestoreBtn()"
    (mouseenter)="onRestoreBtnEnter()"
    (mouseleave)="onRestoreBtnLeave()"
    (click)="restoreSidebar()"
    aria-label="Mostrar menú lateral"
    title="Mostrar menú lateral"
    id="btn-restore-sidebar"
  >
    <svg
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <polyline points="9 18 15 12 9 6"></polyline>
    </svg>
  </button>

  <!-- ══════════════════ SIDEBAR ══════════════════ -->
  <aside class="sidebar" [class.sidebar--hidden]="isSidebarHidden()">

    <!-- Botón circular para ocultar completamente la barra -->
    <button
      type="button"
      class="btn-toggle-sidebar"
      (click)="toggleSidebar()"
      aria-label="Ocultar menú lateral"
      title="Ocultar menú lateral"
      id="btn-toggle-sidebar"
    >
      <svg
        width="14"
        height="14"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="toggle-icon"
      >
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>

    <!-- Logo -->
    <div class="sidebar-brand" title="Senza Consultorios">
      <div class="brand-icon">
        <span style="font-family: var(--font-brand); font-size: 2.5rem; line-height: 1; font-weight: 400; font-style: italic; color: var(--color-brand-purple); padding-right: 2px;">S</span>
      </div>
      <span class="brand-name">Senza</span>
    </div>

    <!-- Nav items -->
    <nav class="sidebar-nav">
      <a
        class="nav-item"
        routerLink="/dashboard/pacientes"
        routerLinkActive="nav-item--active"
        id="nav-cola-espera"
        title="Cola de espera"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        <span class="nav-text">Cola de espera</span>
      </a>

      <a
        class="nav-item"
        routerLink="/dashboard/turnero"
        routerLinkActive="nav-item--active"
        id="nav-turnero"
        title="Turnero"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="20" height="15" x="2" y="7" rx="2" ry="2"/>
          <polyline points="17 2 12 7 7 2"/>
        </svg>
        <span class="nav-text">Turnero</span>
      </a>

      <a
        class="nav-item"
        routerLink="/dashboard/odontologos"
        routerLinkActive="nav-item--active"
        id="nav-odontologos"
        title="Odontólogos"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M19 11v6"/>
          <path d="M22 14h-6"/>
        </svg>
        <span class="nav-text">Odontólogos</span>
      </a>
    </nav>
    <!-- Spacer para empujar el footer hacia abajo -->
    <div class="sidebar-spacer"></div>

    <!-- Profesional activo (iniciales) + logout -->
    <div class="sidebar-footer">
      <div class="prof-badge" [title]="professionalName() + ' — ' + office()">
        <div class="prof-avatar">{{ initials() }}</div>
      </div>
      <button class="btn-logout" (click)="logout()" id="btn-logout" title="Cerrar sesión">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>

  </aside>

  <!-- ══════════════════ CONTENIDO ══════════════════ -->
  <main class="dashboard-content">
    <div class="content-scroll">
      <router-outlet />
    </div>
  </main>

</div>
