<div class="flex h-screen overflow-hidden bg-app-main">

  <!-- ══════════════════ SIDEBAR ══════════════════ -->
  <aside class="w-64 shrink-0 flex flex-col bg-app-card border-r border-brand-purple/15 py-5 h-screen overflow-y-auto shadow-sm">

    <!-- Logo -->
    <div class="flex items-center gap-3 px-5 pb-5 border-b border-brand-purple/10 mb-4">
      <div class="drop-shadow-sm">
        <span style="font-family: var(--font-brand); font-size: 2.5rem; line-height: 1; font-weight: 400; font-style: italic; color: var(--color-brand-purple); padding-right: 2px;">S</span>
      </div>
      <span class="font-brand text-2xl font-bold text-app-text tracking-wide">Senza</span>
    </div>

    <!-- Nav items -->
    <nav class="flex flex-col gap-1 px-3">
      <a
        class="flex items-center gap-3 px-4 py-3 rounded-xl text-app-muted font-semibold text-sm transition-all duration-200 cursor-pointer hover:bg-brand-purple/10 hover:text-brand-purple"
        routerLink="/dashboard/pacientes"
        routerLinkActive="bg-brand-purple/15 text-brand-purple-dark font-bold [&>svg]:text-brand-purple-dark"
        id="nav-cola-espera"
      >
        <svg class="shrink-0 transition-colors" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        <span>Cola de espera</span>
      </a>

      <a
        class="flex items-center gap-3 px-4 py-3 rounded-xl text-app-muted font-semibold text-sm transition-all duration-200 cursor-pointer hover:bg-brand-purple/10 hover:text-brand-purple"
        routerLink="/dashboard/odontologos"
        routerLinkActive="bg-brand-purple/15 text-brand-purple-dark font-bold [&>svg]:text-brand-purple-dark"
        id="nav-odontologos"
      >
        <svg class="shrink-0 transition-colors" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M19 11v6"/>
          <path d="M22 14h-6"/>
        </svg>
        <span>Odontólogos</span>
      </a>
    </nav>
    <!-- Spacer para empujar el footer hacia abajo -->
    <div class="flex-1"></div>

    <!-- Profesional activo (iniciales) + logout -->
    <div class="flex items-center justify-between px-5 pt-4 pb-1 border-t border-brand-purple/15 mt-auto">
      <div class="flex items-center cursor-default" [title]="professionalName() + ' — ' + office()">
        <div class="w-11 h-11 rounded-full bg-gradient-to-br from-brand-purple to-brand-purple-dark text-white flex items-center justify-center font-bold text-sm uppercase tracking-wider shadow-md shadow-brand-purple/30 hover:scale-105 transition-transform duration-200 select-none">{{ initials() }}</div>
      </div>
      <button class="flex items-center justify-center w-10 h-10 rounded-xl bg-red-500/5 border border-red-500/20 text-app-muted hover:bg-red-500/15 hover:border-red-500/40 hover:text-red-500 hover:scale-105 transition-all duration-200 cursor-pointer" (click)="logout()" id="btn-logout" title="Cerrar sesión">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>

  </aside>

  <!-- ══════════════════ CONTENIDO ══════════════════ -->
  <main class="flex-1 flex flex-col bg-app-main overflow-hidden">
    <div class="flex-1 overflow-y-auto flex flex-col">
      <router-outlet />
    </div>
  </main>

</div>
