<div class="flex h-screen overflow-hidden bg-app-main">

  <!-- ══════════════════ SIDEBAR ══════════════════ -->
  <aside
    class="shrink-0 flex flex-col bg-app-card border-r border-brand-purple/15 py-5 h-screen overflow-y-auto shadow-sm transition-all duration-300 relative"
    [ngClass]="isCollapsed() ? 'w-20' : 'w-64'"
  >

    <!-- Botón circular para contraer / expandir -->
    <button
      type="button"
      class="absolute top-6 -right-3.5 w-7 h-7 bg-white border border-brand-purple/20 rounded-full flex items-center justify-center text-brand-purple shadow-md hover:bg-brand-purple hover:text-white transition-all duration-200 cursor-pointer z-10"
      (click)="toggleSidebar()"
      [attr.aria-label]="isCollapsed() ? 'Expandir menú lateral' : 'Contraer menú lateral'"
      [title]="isCollapsed() ? 'Expandir menú' : 'Contraer menú'"
      id="btn-toggle-sidebar"
    >
      <svg
        width="14"
        height="14"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="transition-transform duration-300"
        [ngClass]="isCollapsed() ? 'rotate-180' : ''"
      >
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>

    <!-- Logo -->
    <div
      class="flex items-center gap-3 pb-5 border-b border-brand-purple/10 mb-4 transition-all duration-300"
      [ngClass]="isCollapsed() ? 'px-3 justify-center' : 'px-5'"
      [title]="isCollapsed() ? 'Senza Consultorios' : ''"
    >
      <div class="drop-shadow-sm shrink-0">
        <span style="font-family: var(--font-brand); font-size: 2.5rem; line-height: 1; font-weight: 400; font-style: italic; color: var(--color-brand-purple); padding-right: 2px;">S</span>
      </div>
      <span class="font-brand text-2xl font-bold text-app-text tracking-wide whitespace-nowrap overflow-hidden transition-all duration-300" *ngIf="!isCollapsed()">
        Senza
      </span>
    </div>

    <!-- Nav items -->
    <nav class="flex flex-col gap-1 px-3">
      <!-- 1. Cola de espera -->
      <a
        class="flex items-center gap-3 px-3.5 py-3 rounded-xl text-app-muted font-semibold text-sm transition-all duration-200 cursor-pointer hover:bg-brand-purple/10 hover:text-brand-purple"
        [ngClass]="isCollapsed() ? 'justify-center' : ''"
        routerLink="/dashboard/pacientes"
        routerLinkActive="bg-brand-purple/15 text-brand-purple-dark font-bold"
        id="nav-cola-espera"
        title="Cola de espera"
      >
        <svg class="shrink-0 transition-colors" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        <span class="whitespace-nowrap overflow-hidden transition-all duration-300" *ngIf="!isCollapsed()">Cola de espera</span>
      </a>

      <!-- 2. Turnero TV -->
      <a
        class="flex items-center gap-3 px-3.5 py-3 rounded-xl text-app-muted font-semibold text-sm transition-all duration-200 cursor-pointer hover:bg-brand-purple/10 hover:text-brand-purple"
        [ngClass]="isCollapsed() ? 'justify-center' : ''"
        routerLink="/dashboard/turnero"
        routerLinkActive="bg-brand-purple/15 text-brand-purple-dark font-bold"
        id="nav-turnero"
        title="Turnero"
      >
        <svg class="shrink-0 transition-colors" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="20" height="15" x="2" y="7" rx="2" ry="2"/>
          <polyline points="17 2 12 7 7 2"/>
        </svg>
        <span class="whitespace-nowrap overflow-hidden transition-all duration-300" *ngIf="!isCollapsed()">Turnero</span>
      </a>

      <!-- 3. Odontólogos -->
      <a
        class="flex items-center gap-3 px-3.5 py-3 rounded-xl text-app-muted font-semibold text-sm transition-all duration-200 cursor-pointer hover:bg-brand-purple/10 hover:text-brand-purple"
        [ngClass]="isCollapsed() ? 'justify-center' : ''"
        routerLink="/dashboard/odontologos"
        routerLinkActive="bg-brand-purple/15 text-brand-purple-dark font-bold"
        id="nav-odontologos"
        title="Odontólogos"
      >
        <svg class="shrink-0 transition-colors" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M19 11v6"/>
          <path d="M22 14h-6"/>
        </svg>
        <span class="whitespace-nowrap overflow-hidden transition-all duration-300" *ngIf="!isCollapsed()">Odontólogos</span>
      </a>
    </nav>

    <!-- Spacer para empujar el footer hacia abajo -->
    <div class="flex-1"></div>

    <!-- Profesional activo (iniciales) + logout -->
    <div
      class="flex items-center pt-4 pb-1 border-t border-brand-purple/15 mt-auto transition-all duration-300"
      [ngClass]="isCollapsed() ? 'flex-col gap-3 px-2 justify-center' : 'justify-between px-5'"
    >
      <div class="flex items-center cursor-default" [title]="professionalName() + ' — ' + office()">
        <div class="w-10 h-10 rounded-full bg-gradient-to-br from-brand-purple to-brand-purple-dark text-white flex items-center justify-center font-bold text-xs uppercase tracking-wider shadow-md shadow-brand-purple/30 hover:scale-105 transition-transform duration-200 select-none shrink-0">
          {{ initials() }}
        </div>
      </div>
      <button
        class="flex items-center justify-center w-9 h-9 rounded-xl bg-red-500/5 border border-red-500/20 text-app-muted hover:bg-red-500/15 hover:border-red-500/40 hover:text-red-500 hover:scale-105 transition-all duration-200 cursor-pointer shrink-0"
        (click)="logout()"
        id="btn-logout"
        title="Cerrar sesión"
      >
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>

  </aside>

  <!-- ══════════════════ CONTENIDO ══════════════════ -->
  <main class="flex-1 flex flex-col bg-app-main overflow-hidden">
    <div class="flex-1 overflow-y-auto flex flex-col">
      <router-outlet />
    </div>
  </main>

</div>
